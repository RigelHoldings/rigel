<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Payment Page</title>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:420px;
      background:#1e293b;
      border-radius:24px;
      padding:28px;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
      text-align:center;
    }

    h1{
      font-size:32px;
      margin-bottom:12px;
    }

    .subtitle{
      color:#94a3b8;
      font-size:14px;
      line-height:1.6;
      margin-bottom:28px;
    }

    .qr-wrapper{
      background:white;
      padding:16px;
      border-radius:20px;
      display:inline-block;
      margin-bottom:24px;
    }

    .qr-wrapper img{
      width:100%;
      max-width:280px;
      display:block;
    }

    .pay-btn{
      display:block;
      width:100%;
      background:#10b981;
      color:white;
      text-decoration:none;
      padding:16px;
      border-radius:14px;
      font-size:16px;
      font-weight:bold;
      transition:0.2s;
    }

    .pay-btn:hover{
      background:#059669;
    }

    .info{
      margin-top:22px;
      color:#94a3b8;
      font-size:13px;
      line-height:1.7;
    }

    .footer{
      margin-top:26px;
      color:#64748b;
      font-size:12px;
    }

/* =========================================================
   SILVER PAYMENT PAGE
   GLASS + SUBTLE 3D ENHANCEMENT
   ---------------------------------------------------------
   Existing colour template preserved.
   Existing classes preserved.
   Append after the original CSS.
========================================================= */


/* =========================================================
   PAYMENT CONTAINER
========================================================= */

.container {

    /* Existing colour preserved */
    background: rgba(30, 41, 59, 0.88);

    backdrop-filter:
        blur(20px)
        saturate(115%);

    -webkit-backdrop-filter:
        blur(20px)
        saturate(115%);

    border:
        1px solid
        rgba(255,255,255,0.08);

    box-shadow:

        0 15px 45px
        rgba(0,0,0,0.40),

        0 30px 80px
        rgba(0,0,0,0.20),

        inset 0 1px 0
        rgba(255,255,255,0.08),

        inset 0 -1px 0
        rgba(0,0,0,0.15);

    transform:
        translateZ(0);

    transition:
        transform 0.4s
        cubic-bezier(.2,.8,.2,1),

        box-shadow 0.4s ease;
}


/* Desktop hover */
.container:hover {

    transform:
        translateY(-5px);

    box-shadow:

        0 20px 55px
        rgba(0,0,0,0.45),

        0 35px 90px
        rgba(0,0,0,0.22),

        inset 0 1px 0
        rgba(255,255,255,0.10),

        inset 0 -1px 0
        rgba(0,0,0,0.15);
}



/* =========================================================
   SUBTLE GLASS HIGHLIGHT
========================================================= */

.container::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 45%;

    border-radius:
        24px 24px 45% 45%;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,0.055),
            rgba(255,255,255,0)
        );

    pointer-events: none;

    z-index: 0;
}


/* Keep content above glass highlight */
.container > * {

    position: relative;

    z-index: 1;
}



/* =========================================================
   PAYMENT TITLE
========================================================= */

.container h1 {

    text-shadow:
        0 2px 12px
        rgba(0,0,0,0.20);

    letter-spacing:
        clamp(0px, 0.15vw, 1px);

    transition:
        transform 0.3s ease;
}


.container:hover h1 {

    transform:
        translateY(-1px);
}



/* =========================================================
   SUBTITLE
========================================================= */

.subtitle {

    transition:
        opacity 0.3s ease;
}


.container:hover .subtitle {

    opacity: 0.92;
}



/* =========================================================
   QR CODE GLASS FRAME
========================================================= */

.qr-wrapper {

    position: relative;

    background:
        rgba(255,255,255,0.96);

    border:
        1px solid
        rgba(255,255,255,0.55);

    box-shadow:

        0 10px 30px
        rgba(0,0,0,0.25),

        0 2px 8px
        rgba(0,0,0,0.15),

        inset 0 1px 0
        rgba(255,255,255,0.90);

    transform:
        translateZ(8px);

    transition:
        transform 0.35s
        cubic-bezier(.2,.8,.2,1),

        box-shadow 0.35s ease;
}


/* QR depth */
.qr-wrapper:hover {

    transform:
        translateY(-5px)
        translateZ(14px);

    box-shadow:

        0 16px 40px
        rgba(0,0,0,0.30),

        0 4px 12px
        rgba(0,0,0,0.16),

        inset 0 1px 0
        rgba(255,255,255,0.95);
}


/* QR image */
.qr-wrapper img {

    transition:
        transform 0.35s ease;
}


.qr-wrapper:hover img {

    transform:
        scale(1.015);
}



/* =========================================================
   PAYMENT BUTTON
   ---------------------------------------------------------
   Green colours are intentionally unchanged.
========================================================= */

.pay-btn {

    position: relative;

    overflow: hidden;

    box-shadow:

        0 7px 18px
        rgba(0,0,0,0.20),

        inset 0 1px 0
        rgba(255,255,255,0.15);

    transform:
        translateZ(6px);

    transition:
        transform 0.25s
        cubic-bezier(.2,.8,.2,1),

        box-shadow 0.25s ease,

        background 0.2s ease;
}


/* Glass highlight on button */
.pay-btn::before {

    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 70%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.14),
            transparent
        );

    transform:
        skewX(-20deg);

    transition:
        left 0.6s ease;

    pointer-events: none;
}


.pay-btn:hover {

    transform:
        translateY(-3px)
        translateZ(10px);

    box-shadow:

        0 12px 28px
        rgba(0,0,0,0.28),

        inset 0 1px 0
        rgba(255,255,255,0.18);
}


.pay-btn:hover::before {

    left: 140%;
}


/* Physical press effect */
.pay-btn:active {

    transform:
        translateY(1px)
        translateZ(2px);

    box-shadow:
        0 4px 10px
        rgba(0,0,0,0.20);
}



/* =========================================================
   INFORMATION PANEL
========================================================= */

.info {

    padding:
        clamp(10px, 2vw, 16px);

    border-radius:
        clamp(10px, 1.5vw, 16px);

    background:
        rgba(255,255,255,0.025);

    border:
        1px solid
        rgba(255,255,255,0.045);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.035);

    transition:
        background 0.3s ease,
        transform 0.3s ease;
}


.info:hover {

    background:
        rgba(255,255,255,0.04);

    transform:
        translateY(-2px);
}



/* =========================================================
   FOOTER
========================================================= */

.footer {

    opacity: 0.85;

    transition:
        opacity 0.3s ease;
}


.container:hover .footer {

    opacity: 1;
}



/* =========================================================
   RESPONSIVE SIZING
========================================================= */

@media (min-width: 769px) {

    body {

        perspective:
            1200px;

        perspective-origin:
            50% 40%;
    }

    .container {

        transform-style:
            preserve-3d;
    }

}



/* =========================================================
   TABLET
========================================================= */

@media (max-width: 768px) {

    body {

        padding:
            clamp(15px, 4vw, 25px);
    }

    .container {

        width: 100%;

        padding:
            clamp(22px, 5vw, 32px);

        border-radius:
            clamp(20px, 5vw, 24px);
    }

    .qr-wrapper {

        padding:
            clamp(12px, 4vw, 16px);
    }

    .qr-wrapper img {

        width:
            min(100%, 280px);
    }

    .pay-btn {

        padding:
            clamp(14px, 4vw, 16px);

        font-size:
            clamp(14px, 4vw, 16px);
    }

}



/* =========================================================
   SMALL PHONES
========================================================= */

@media (max-width: 420px) {

    body {

        padding:
            12px;
    }

    .container {

        padding:
            20px 15px;

        border-radius:
            19px;
    }

    .container h1 {

        font-size:
            clamp(25px, 8vw, 32px);
    }

    .subtitle {

        font-size:
            clamp(12px, 3.5vw, 14px);

        margin-bottom:
            22px;
    }

    .qr-wrapper {

        padding:
            11px;

        border-radius:
            16px;

        margin-bottom:
            20px;
    }

    .info {

        font-size:
            clamp(12px, 3.5vw, 13px);
    }

}



/* =========================================================
   REDUCED MOTION
========================================================= */

@media (prefers-reduced-motion: reduce) {

    .container,
    .container h1,
    .qr-wrapper,
    .qr-wrapper img,
    .pay-btn,
    .info,
    .footer {

        transition: none;
    }

    .container:hover,
    .container:hover h1,
    .qr-wrapper:hover,
    .qr-wrapper:hover img,
    .pay-btn:hover,
    .pay-btn:active,
    .info:hover {

        transform: none;
    }

    .pay-btn::before {

        display: none;
    }

}

  </style>
</head>
<body>

  <div class="container">

    <h1>Pay Now</h1>

    <div class="subtitle">
      Scan the QR code.<br>
      A surprisingly efficient financial system held together by QR codes and collective optimism.
    </div>

    <!-- YOUR STATIC QR CODE -->
    <div class="qr-wrapper">
      <img src="QR/silver.png" alt="UPI QR Code">
    </div>

    <!-- YOUR STATIC UPI LINK -->
    </!-- a
      class="pay-btn"
      href="upi://pay?pa=9773585691@upi&pn=Rigel&am=1299&cu=INR"
    
      Open UPI App
      </a>

    <div class="info">
      Supported on Google Pay, PhonePe, Paytm,
      BHIM, and most banking apps.
    </div>

    <div class="footer">
      No payment gateways were harmed in the making of this page.
    </div>

  </div>

</body>
</html>
